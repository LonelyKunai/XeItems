[workspace]
resolver = "3"
members = ["xe-common", "xe-items"]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Arclinker"]

[workspace.dependencies]
pumpkin-plugin-api = "0.1.0-dev"
xe-common = { path = "xe-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# Local copy of the crate with the WIT files of the server actually in use
# (Pumpkin 0.2.0 / Minecraft 26.3); crates.io only has the 26.2 version.
[patch.crates-io]
pumpkin-plugin-api = { path = "vendor/pumpkin-plugin-api" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
